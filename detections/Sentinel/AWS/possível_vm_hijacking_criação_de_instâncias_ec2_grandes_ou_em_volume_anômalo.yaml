name: Possível VM Hijacking criação de instâncias EC2 grandes ou em volume anômalo ##
exception_fields: []
description: |
  Detecta possível VM Hijacking (sequestro de recursos computacionais) na AWS, a partir da criação de instâncias EC2 que sugerem abuso para cryptomining ou consumo indevido da conta.
severity: High
enabled: true
queryFrequency: 10m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
  - DefenseEvasion
relevantTechniques:
  - T1496
  - T1578
  - T1078
  - T1496.004
  - T1578.002
  - T1078.004
  - T1496.001
query: |
  let lookback   = 10m;
  let ingestion_delay = 20m;
  let qty_threshold  = 5;
  let vcpu_threshold = 64;    // total de vCPUs dentro da janela do lookback
  // Famílias de GPU/aceleradores:
  let gpu_type   = @"^(p|g|gr|inf|trn|dl|hpc)[0-9]";
  // Tamanhos grandes:
  let large_size = @"\.(9|12|16|18|24|32|48|56|64|96|112)xlarge$|\.metal";
  AWSCloudTrail
  | where TimeGenerated >= ago(ingestion_delay + lookback)
  | where ingestion_time() > ago(lookback)
  | where EventSource == "ec2.amazonaws.com" and EventName =~ "RunInstances"
  | where isempty(ErrorCode) and isempty(ErrorMessage)
  | where SourceIpAddress !contains "amazonaws.com"
  | extend Country = tostring(geo_info_from_ip_address(SourceIpAddress).country)
  | extend Req = parse_json(RequestParameters), Resp = parse_json(ResponseElements)
  // Quantidade solicitada na chamada
  | extend Qty = toint(Req.instancesSet.items[0].maxCount)
  | mv-expand Item = Resp.instancesSet.items
  | extend InstanceId   = tostring(Item.instanceId),
           InstanceType = tostring(coalesce(Item.instanceType, Req.instanceType)),
           OSplatform   = iff(isempty(tostring(Item.platform)), "Linux", tostring(Item.platform)),
           Cores        = toint(Item.cpuOptions.coreCount),
           Threads      = toint(Item.cpuOptions.threadsPerCore)
  // vCPUs por instância
  | extend vCPU    = Cores * Threads
  | extend BigType = InstanceType matches regex gpu_type
                  or InstanceType matches regex large_size
  // Normalização da identidade
  | extend UserIdentityArn = iif(isempty(UserIdentityArn), tostring(parse_json(Resources)[0].ARN), UserIdentityArn)
  | extend Actor    = iff(isnotempty(SessionIssuerArn), SessionIssuerArn, UserIdentityArn)
  | extend UserName = tostring(split(UserIdentityArn, "/")[-1])
  | extend AccountName = case(
      UserIdentityPrincipalid == "Anonymous", "Anonymous",
      isempty(UserIdentityUserName), UserIdentityPrincipalid,
      UserIdentityUserName)
  | extend AccountUPNSuffix = iif(AccountName contains "@", tostring(split(AccountName, "@")[1]), ""),
           AccountName      = iif(AccountName contains "@", tostring(split(AccountName, "@")[0]), AccountName)
  | summarize Start         = min(TimeGenerated),
              End           = max(TimeGenerated),
              totalvCPU     = sum(vCPU),
              MaxQty        = max(Qty),
              BigTypeEvents = dcountif(AwsEventId, BigType),
              HighQtyEvents = dcountif(AwsEventId, Qty >= qty_threshold),
              InstanceCount = dcount(InstanceId),
              InstanceIds   = make_set(InstanceId, 100),
              InstanceTypes = make_set(InstanceType),
              OSplatforms   = make_set(OSplatform),
              Regions       = make_set(AWSRegion)
              by Actor, AccountName, AccountUPNSuffix, UserIdentityArn, SourceIpAddress, Country, UserAgent
  | where BigTypeEvents > 0
       or HighQtyEvents > 0
       or totalvCPU > vcpu_threshold
  | extend Reasons = strcat(
      iff(BigTypeEvents > 0, "tipo GPU/grande; ", ""),
      iff(HighQtyEvents > 0, strcat("quantidade >= ", qty_threshold, "; "), ""),
      iff(totalvCPU > vcpu_threshold,
          strcat("vCPU total > ", vcpu_threshold, " em ", tostring(lookback / 1m), " min; "), ""))
  | order by totalvCPU desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserIdentityArn
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: InstanceIds
customDetails:
  UserIdentity: UserIdentityArn
  SourceIP: SourceIpAddress
  Country: Country
  InstancesIDs: InstanceIds
  InstanceType: InstanceTypes
  Region: Regions
  Reason: Reasons
  UserAgent: UserAgent
eventGroupingSettings:  #Event Grouping
  aggregationKind: SingleAlert  # SingleAlert  ou AlertPerResult
incidentConfiguration:  # Incident Configuration
  createIncident: true  # true = cria incidente | false = só gera o alerta
  groupingConfiguration:  # Mapeamento de IncidentGrouping
    enabled: true  # agrupar alertas relacionados em um único incidente
    reopenClosedIncident: false  # reabrir incidente fechado se surgir alerta relacionado
    lookbackDuration: PT1H  # janela de agrupamento (PT5H = 5HRS)
    matchingMethod: AllEntities  # AllEntities | AnyAlert | Selected
